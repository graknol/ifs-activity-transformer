[project]
name = "ifs-activity-transformer"
version = "1.0.0"
description = "Web app for training RoBERTa BigBird classifier to map IFS10 activities to IFS Cloud structure"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = {text = "MIT"}
authors = [
    {name = "graknol", email = "1364029+graknol@users.noreply.github.com"}
]
keywords = [
    "machine-learning",
    "transformers",
    "active-learning",
    "flask",
    "roberta",
    "bigbird",
    "ifs-cloud"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core web framework
    "flask>=3.0.0,<4.0.0",
    
    # Machine Learning and Transformers
    "transformers>=4.36.0,<5.0.0",
    "torch>=2.1.0,<3.0.0",
    "datasets>=2.16.0,<3.0.0",
    
    # Database
    "oracledb>=2.0.0,<3.0.0",
    
    # Configuration and utilities
    "python-dotenv>=1.0.0,<2.0.0",
    "pandas>=2.1.0,<3.0.0",
    "numpy>=1.26.0,<2.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "tqdm>=4.66.0,<5.0.0",
    
    # Production server
    "gunicorn>=21.2.0,<22.0.0",
    
    # Cloud storage
    "azure-storage-blob>=12.19.0,<13.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
]

dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "flake8>=7.0.0,<8.0.0",
    "black>=24.0.0,<25.0.0",
    "isort>=5.13.0,<6.0.0",
]

[project.urls]
Homepage = "https://github.com/graknol/ifs-activity-transformer"
Repository = "https://github.com/graknol/ifs-activity-transformer"
Issues = "https://github.com/graknol/ifs-activity-transformer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require external services)",
    "slow: Slow tests (e.g., model training, large data processing)",
    "gpu: Tests that require GPU",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app", "services"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
fail_under = 70

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
]
